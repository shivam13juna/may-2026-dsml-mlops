#yet another markup languag

name: CI


on:
  push:
    branches: 
        - main
        - any-feature-branch.



jobs: 
    
    job1: 

        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                python-version: '3.10'

            - name: Install dependencies
              run: |
                python -m pip install --upgrade pip
                pip install -r session_6_CI/requirements.txt

            - name: Run tests
              run: |
                pytest .